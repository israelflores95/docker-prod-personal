  #   container_name: sonarr
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #   volumes:
  #     - ${DOCKER_CONFIG_DIR}/sonarr:/config
  #     - ${DOCKER_DATA_DIR}/media:/data
  #   ports:
