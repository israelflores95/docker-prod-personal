services:
  # --- 1. CLOUDFLARE TUNNEL ---
  # Think of this as a secure "phone call" from your computer to Cloudflare.
  # It lets you share your services with the world without opening your router's firewall.
  cloudflared:
    image: cloudflare/cloudflared:latest # The "Blueprint" used to build the container
    container_name: cloudflared          # The friendly name for this container
    restart: unless-stopped              # Automatically start if the computer reboots
    command: tunnel --no-autoupdate run  # The specific instruction for this app
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN} # Uses the secret token from your .env file
    networks:
      - cf-tunnel                        # Joins the private "room" to talk to other apps

  # --- 2. REVERSE PROXY (TRAEFIK) ---
  # Routes internal *.casa-flores.net hostnames to the right container and
  # issues real HTTPS certs via Cloudflare's DNS-01 challenge (works behind CGNAT
  # since it proves domain ownership with a DNS TXT record, not a reachable port).
  traefik:
    container_name: traefik
    image: traefik:latest
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      # Bypass the local/LAN resolver for the propagation check - it's the
      # same resolver doing split-horizon overrides for *.casa-flores.net,
      # so it never sees the real _acme-challenge TXT record Cloudflare published.
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    environment:
      - CF_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}
      # Traefik's bundled Docker client can fail version negotiation against
      # the socket and fall back to its oldest default (API 1.24), which
      # newer daemons refuse. Pin it explicitly to skip that.
      - DOCKER_API_VERSION=1.41
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_CONFIG_DIR}/traefik/letsencrypt:/letsencrypt
    networks:
      - cf-tunnel

  # --- 3. DASHBOARD (HOMARR) ---
  # This is a website that gives you a nice UI to see all your other apps.
  homarr:
    container_name: homarr
    image: ghcr.io/ajnart/homarr:latest
    restart: unless-stopped
    volumes:
      # Volumes = "Memory". Without these, your settings vanish when the app restarts.
      # Left side: Folder on your computer | Right side: Folder inside the container
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR}/homarr/configs:/app/data/configs
      - ${DOCKER_CONFIG_DIR}/homarr/icons:/app/public/icons
      - ${DOCKER_DATA_DIR}/homarr/data:/data
    environment:
      - PUID=${PUID} # Tells the app which user "owns" the files (for security)
      - PGID=${PGID}
      - TZ=${TZ}     # Sets the clock to your local time (Utah)
    ports:
      - "7575:7575"  # Opens a "door" on your computer so you can visit http://localhost:7575
    networks:
      - cf-tunnel
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`dashboard.${DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls.certresolver=cloudflare
      - traefik.http.services.dashboard.loadbalancer.server.port=7575
    healthcheck:
      # Fixes the "unhealthy" status by checking the correct internal port
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7575/api/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- 4. MEDIA SERVER (JELLYFIN) ---
  # Jellyfin is a free and open-source media system.
  # We use the LinuxServer.io version because it handles file permissions very well.
  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/jellyfin/config:/config
      - ${DOCKER_MEDIA_DIR}:/data/media:ro
    ports:
      - "8096:8096"
    networks:
      - cf-tunnel
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.tls.certresolver=cloudflare
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096

  # --- 5. VPN & DOWNLOADERS ---
  # Gluetun routes traffic for qBittorrent and Prowlarr through ProtonVPN.
  # This provides a "Kill Switch" - if the VPN drops, the apps lose internet.
  gluetun:
    image: qmcgaw/gluetun
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=Iceland # You can change this to your preferred country
    ports:
      - "8080:8080" # qBittorrent Web UI
      - "9696:9696" # Prowlarr Web UI
      - "6881:6881" # qBittorrent Torrent Port
      - "6881:6881/udp"
    networks:
      - cf-tunnel
    restart: unless-stopped
    labels:
      # qbittorrent and prowlarr share this container's network namespace
      # (network_mode: "service:gluetun"), so Traefik routes to them here.
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN}`)
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.tls.certresolver=cloudflare
      - traefik.http.routers.qbittorrent.service=qbittorrent
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.tls.certresolver=cloudflare
      - traefik.http.routers.prowlarr.service=prowlarr
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696

  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${DOCKER_CONFIG_DIR}/qbittorrent/config:/config
      - ${DOCKER_MEDIA_DIR}:/data/media

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/sonarr/config:/config
      - ${DOCKER_MEDIA_DIR}:/data/media
    ports:
      - "8989:8989"
    networks:
      - cf-tunnel
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls.certresolver=cloudflare
      - traefik.http.services.sonarr.loadbalancer.server.port=8989

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/radarr/config:/config
      - ${DOCKER_MEDIA_DIR}:/data/media
    ports:
      - "7878:7878"
    networks:
      - cf-tunnel
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls.certresolver=cloudflare
      - traefik.http.services.radarr.loadbalancer.server.port=7878

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/prowlarr/config:/config
networks:
  # This creates a private virtual network for your containers to talk to each other.
  cf-tunnel:
    name: cf-tunnel
    driver: bridge
