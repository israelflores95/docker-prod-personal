services:
  # --- CLOUDFLARE TUNNEL ---
  # This container connects your home server to Cloudflare without opening ports.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - cf-tunnel

  # --- DASHBOARD ---
  # A simple home server dashboard to organize your links.
  # Access locally via http://localhost:7575
  # Access via tunnel: dashboard.${DOMAIN} -> http://homarr:7575
  homarr:
    container_name: homarr
    image: ghcr.io/ajnart/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional: for docker integration
      - ${DOCKER_CONFIG_DIR}/homarr/configs:/app/data/configs
      - ${DOCKER_CONFIG_DIR}/homarr/icons:/app/public/icons
      - ${DOCKER_DATA_DIR}/homarr/data:/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "7575:7575"
    networks:
      - cf-tunnel

  # --- MEDIA STACK PLACEHOLDERS ---
  # Uncomment these services as you need them.
  # Remember to point Cloudflare Public Hostnames to the container names (e.g., plex:${PORT})

  # plex:
