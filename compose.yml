services:
  # --- 1. CLOUDFLARE TUNNEL ---
  # Think of this as a secure "phone call" from your computer to Cloudflare.
  # It lets you share your services with the world without opening your router's firewall.
  cloudflared:
    image: cloudflare/cloudflared:latest # The "Blueprint" used to build the container
    container_name: cloudflared          # The friendly name for this container
    restart: unless-stopped              # Automatically start if the computer reboots
    command: tunnel --no-autoupdate run  # The specific instruction for this app
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN} # Uses the secret token from your .env file
    networks:
      - cf-tunnel                        # Joins the private "room" to talk to other apps

  # --- 2. DASHBOARD (HOMARR) ---
  # This is a website that gives you a nice UI to see all your other apps.
  homarr:
    container_name: homarr
    image: ghcr.io/ajnart/homarr:latest
    restart: unless-stopped
    volumes:
      # Volumes = "Memory". Without these, your settings vanish when the app restarts.
      # Left side: Folder on your computer | Right side: Folder inside the container
      - /var/run/docker.sock:/var/run/docker.sock 
      - ${DOCKER_CONFIG_DIR}/homarr/configs:/app/data/configs
      - ${DOCKER_CONFIG_DIR}/homarr/icons:/app/public/icons
      - ${DOCKER_DATA_DIR}/homarr/data:/data
    environment:
      - PUID=${PUID} # Tells the app which user "owns" the files (for security)
      - PGID=${PGID}
      - TZ=${TZ}     # Sets the clock to your local time (Utah)
    ports:
      - "7575:7575"  # Opens a "door" on your computer so you can visit http://localhost:7575
    networks:
      - cf-tunnel
    healthcheck:
      # Fixes the "unhealthy" status by checking the correct internal port
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7575/api/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- 3. MEDIA SERVER (JELLYFIN) ---
  # Jellyfin is a free and open-source media system.
  # We use the LinuxServer.io version because it handles file permissions very well.
  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/jellyfin/config:/config
      - ${DOCKER_MEDIA_DIR}:/data/media:ro
    ports:
      - "8096:8096"
    networks:
      - cf-tunnel

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/sonarr/config:/config
      - ${DOCKER_MEDIA_DIR}:/data/media:ro
    ports:
      - "8989:8989"
    networks:
      - cf-tunnel

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/radarr/config:/config
      - ${DOCKER_MEDIA_DIR}:/data/media:ro
    ports:
      - "7878:7878"
    networks:
      - cf-tunnel

  prawlarr:
    container_name: prawlarr
    image: lscr.io/linuxserver/prawlarr:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/prawlarr/config:/config
    ports:
      - "8080:8080"
    networks:
      - cf-tunnel
networks:
  # This creates a private virtual network for your containers to talk to each other.
  cf-tunnel:
    name: cf-tunnel
    driver: bridge
